name: Release CLI

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-amd64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable build --release --locked
          mkdir -p dist/package
          install -m 0755 target/release/meowai-deploy dist/package/meowai-deploy
          tar -C dist/package -czf "dist/meowai-deploy-${{ matrix.target }}.tar.gz" meowai-deploy

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meowai-deploy-${{ matrix.target }}
          path: dist/meowai-deploy-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build windows-amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-windows-amd64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-amd64-cargo-

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match Cargo version." }

      - name: Build release archive
        shell: pwsh
        run: |
          cargo +stable build --release --locked
          New-Item -ItemType Directory -Path dist\package -Force | Out-Null
          Copy-Item target\release\meowai-deploy.exe dist\package\meowai-deploy.exe
          Compress-Archive -Path dist\package\meowai-deploy.exe -DestinationPath dist\meowai-deploy-windows-amd64.zip -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meowai-deploy-windows-amd64
          path: dist/meowai-deploy-windows-amd64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release assets
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: meowai-deploy-*
          path: dist
          merge-multiple: true

      - name: Create checksum list
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum meowai-deploy-*.tar.gz meowai-deploy-*.zip > checksums-sha256.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/meowai-deploy-*.tar.gz
          dist/meowai-deploy-*.zip
          dist/checksums-sha256.txt
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"

      - name: Upload assets to published Release
        if: github.event_name == 'release'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          dist/meowai-deploy-*.tar.gz
          dist/meowai-deploy-*.zip
          dist/checksums-sha256.txt
          --clobber
