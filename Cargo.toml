[package]
name = "meowai-deploy"
version = "1.2.5"
edition = "2024"
description = "Interactive deployment CLI for MeowAI downstream New API sites"
license = "MIT"
repository = "https://github.com/MeowAI-Business/meowai-deploy"
readme = "README.md"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
cliclack = "0.5.6"
comfy-table = "7.1"
console = "0.16"
ed25519-dalek = "2.1"
fs2 = "0.4"
futures-util = "0.3"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
secrecy = "0.10"
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-escape = "0.1"
tempfile = "3.15"
tar = "0.4"
thiserror = "2.0"
zstd = "0.13"
include_dir = "0.7"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
webbrowser = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
wiremock = "0.6"
